<!doctype html>

<head>

<title>Deseo Radio — Offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(255,43,54,.12),transparent 35%),#050505;color:#fff;font-family:"Google Sans",sans-serif;text-align:center}main{width:min(520px,100%)}img{width:170px;height:auto;margin:0 auto 34px}h1{margin:0;font-size:44px;line-height:.95;letter-spacing:-.05em;background:linear-gradient(180deg,#fff,#8b8b90 48%,#e5e5e7 72%,#626267);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:.5px #000}p{margin:18px auto 0;max-width:430px;color:#929298;font-size:13px;line-height:1.75}button{margin-top:24px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:#ff2b36;color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<main>
<img src="/assets/img/deseoradio-logo.png" alt="Deseo Radio">
<h1>Offline for a moment.</h1>
<p>Το live stream χρειάζεται σύνδεση στο internet. Μόλις επανέλθει η σύνδεση, φόρτωσε ξανά τη σελίδα.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
